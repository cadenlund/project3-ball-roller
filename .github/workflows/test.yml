name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins, so a green run here means the same tree everyone
      # else has, not whatever resolved today.
      - run: npm ci

      - run: npm test
